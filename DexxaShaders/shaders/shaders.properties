# Dexxa Shaders - config
# Buffers:
# colortex0 = scene color
# colortex1 = RG: octahedral normal, B: smoothness, A: material id (0=none 1=water 2=reflective)
# colortex2 = sky/fog reflection fallback color

clouds=fast
vignette=false
underwaterOverlay=false
sun=true
moon=true

oldLighting=false
separateAo=false

# Reflections toggle in shader options
screen=<REFLECTION_STRENGTH> <SSR_STEPS> <ENABLE_WATER_WAVES> <WATER_WAVE_SPEED> <SATURATION> <VIGNETTE>
